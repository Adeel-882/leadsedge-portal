<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#070707;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#070707;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                 style="max-width:600px;background:#111111;border:1px solid #262626;border-radius:18px;">

            <tr>
              <td style="padding:34px 38px 12px;">
                <div style="font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#FF4134;">
                  LeadsEdge Portal
                </div>
              </td>
            </tr>

            <tr>
              <td style="padding:4px 38px 8px;">
                <h1 style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:30px;line-height:38px;font-weight:800;color:#F7F7F2;">
                  Sign in to your portal
                </h1>
              </td>
            </tr>

            <tr>
              <td style="padding:10px 38px 22px;">
                <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:26px;color:#A7A7A2;">
                  Use the secure button below to sign in to LeadsEdge Portal. This link expires shortly and can only be used once.
                </p>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding:8px 38px 14px;">
                <a href="https://portal.leadsedge.us/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next={{ .RedirectTo | urlquery }}"
                   style="display:inline-block;background:#FF4134;color:#FFFFFF;text-decoration:none;
                          font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;
                          line-height:20px;padding:14px 24px;border-radius:9px;text-align:center;">
                  Open LeadsEdge Portal
                </a>
              </td>
            </tr>

            <tr>
              <td style="padding:26px 38px 34px;">
                <div style="border-top:1px solid #262626;padding-top:20px;">
                  <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:21px;color:#7E7E79;">
                    If you did not request this sign-in link, you can safely ignore this email.
                  </p>
                </div>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
